<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectSphere - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #111827; /* Dark background */
            color: #F9FAFB; /* Light text */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            flex-direction: column;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #3B82F6; /* Primary color */
        }
        p {
            font-size: 1.1rem;
            color: #D1D5DB; /* Muted text */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are Offline</h1>
        <p>It seems you've lost your connection. Please check your internet and try again.</p>
    </div>
</body>
</html>
