<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConnectSphere - Offline</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f5;
            color: #333;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            padding: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 600;
        }
        p {
            color: #666;
        }
        .dark body {
             background-color: #09090b;
             color: #fafafa;
        }
        .dark p {
            color: #a1a1aa;
        }
        /* Respect user's device theme */
        @media (prefers-color-scheme: dark) {
            body {
                background-color: #09090b;
                color: #fafafa;
            }
            p {
                color: #a1a1aa;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>You are Offline</h1>
        <p>Please check your internet connection and try again. Some features may be available once you're back online.</p>
    </div>
</body>
</html>
